[project]
name = "reopenly-cookbook"
version = "0.1.0"
description = "Runnable ReOpenly examples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==3.35.1",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.4.0",
]

[tool.uv]
package = false
